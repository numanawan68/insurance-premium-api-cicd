name: CI Pipeline



on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout Repository
        uses: actions/checkout@v5


      - name: checkout Repository
        uses: actions/checkout@v5

        with:
            python-version: "3.13"

      - name: Verify Python Version
        run: python --version

